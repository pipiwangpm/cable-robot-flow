function draw(q){const s=current();let w=s.kind==='move'?interpPath(s.route,q):nodes[s.at],p=setRobot(w);paintTurn('J1',s.turnBefore.J1);paintTurn('J2',s.turnBefore.J2);if(s.turn)paintTurn(s.turn,s.angle0+(s.angle1-s.angle0)*q);let wheelAngle=mainAngle;if(s.kind==='move'){const w2=interpPath(s.route,Math.min(1,q+.01)),p2=P(w2.x,w2.y);if(q<1)wheelAngle=Math.atan2(p2.y-p.y,p2.x-p.x)*180/Math.PI}else if(s.turn&&s.at===s.turn)wheelAngle=s.angle0+(s.angle1-s.angle0)*q;const wheels=robotParts.querySelectorAll('ellipse'),wa=wheelAngle*Math.PI/180;wheels.forEach((wheel,i)=>{const sign=i===0?-1:1;wheel.setAttribute('cx',sign*12*Math.cos(wa));wheel.setAttribute('cy',sign*12*Math.sin(wa))});markDone(s.done||[]);activeLine.setAttribute('points',s.kind==='move'?points(s.route.map(n=>P(n.x,n.y))):'');let highlight=s.highlight==='all'?edges.map(e=>e[0]):s.highlight||[];routeHighlight.setAttribute('points','');if(highlight.length){for(const id of highlight)if(edgePaths[id])path(edgePaths[id],{stroke:'#c69b67','stroke-width':4,opacity:.6},doneGroup)}
 if(s.coverageStart!==undefined)$('metric').textContent=Math.min(810,Math.round(s.coverageStart+s.coverageLength*q))+' / 810 m（双向）';else if(s.kind==='dwell')$('metric').textContent=Math.min(120,Math.floor(120*q))+' / 120 秒';else $('metric').textContent=s.metric;
 let battery=s.battery??90;if(s.batteryTo!==undefined)battery=Math.round(battery+(s.batteryTo-battery)*q);$('battery').textContent=battery+'%';$('batteryBar').style.width=battery+'%';$('batteryBar').style.background=battery<=20?'#c58b42':'#4e9680';lamp.setAttribute('fill',battery<=20?'#efbe65':'#90d9b4');$('dot').style.background=s.charge?'#c28c3e':'#4d937b';
 const note=s.kind==='dwell'?'停留检测 '+Math.floor(120*q)+' / 120 秒':s.kind==='turn'?'机器人停车 · 转盘转向':s.charge?'正在充电':null;callout.setAttribute('visibility',note?'visible':'hidden');if(note){callout.setAttribute('transform',`translate(${p.x-100} ${p.y+78})`);calloutText.textContent=note}
 $('position').textContent=s.kind==='move'?s.position+' · '+Math.round(q*100)+'%':s.position;$('seek').value=Math.round((state.index+q)/scenes[state.scene].steps.length*1000);$('counter').textContent=`步骤 ${state.index+1} / ${scenes[state.scene].steps.length}`;
 if(state.zoom){const z=s.turn?turnGroups[s.turn].p:p;svg.setAttribute('viewBox',`${z.x-285} ${z.y-210} 570 420`)}else svg.setAttribute('viewBox','0 0 1320 780');
}
function renderPanel(){const scene=scenes[state.scene],s=current();$('eyebrow').textContent=String(state.scene+1).padStart(2,'0')+' / 05 · '+scene.name;$('stepTitle').textContent=s.title;$('taskState').textContent=s.state||(state.scene===0?'待机':'待执行');$('metricLabel').textContent=s.coverageStart!==undefined?'双向检测进度':s.kind==='dwell'?'停留计时':'当前环节';$('steps').replaceChildren();scene.steps.forEach((step,i)=>{const li=document.createElement('li'),b=document.createElement('button');b.type='button';b.className=i===state.index?'current':i<state.index?'past':'';const a=document.createElement('span');a.className='number';a.textContent=String(i+1).padStart(2,'0');const t=document.createElement('span');t.textContent=step.title;b.append(a,t);b.addEventListener('click',()=>load(i,false,1));li.append(b);$('steps').append(li)});$('prev').disabled=state.index===0;$('next').disabled=state.index===scene.steps.length-1&&state.q===1;$('announcement').textContent=s.title;updatePlay()}
function updatePlay(){$('play').firstElementChild.textContent=state.playing?'暂停':state.q===1&&state.index===scenes[state.scene].steps.length-1?'重新播放':'播放'}
function load(i,playing=false,q=0){state.index=Math.max(0,Math.min(scenes[state.scene].steps.length-1,i));state.q=q;state.playing=playing;state.last=0;renderPanel();draw(q)}
function choose(i){state.scene=i;state.playing=false;state.chain=false;state.zoom=false;state.selected=null;$('detail').hidden=true;Array.from($('tabs').children).forEach((b,j)=>{b.classList.toggle('active',i===j);b.setAttribute('aria-selected',String(i===j))});load(0);}
function play(){if(state.playing){state.playing=false;updatePlay();return}if(state.q>=1&&state.index===scenes[state.scene].steps.length-1)load(0);state.chain=true;state.playing=true;state.last=0;updatePlay()}
function next(){if(state.index>=scenes[state.scene].steps.length-1){state.q=1;state.playing=false;draw(1);updatePlay();return}state.chain=false;load(state.index+1,true)}
function prev(){state.chain=false;load(state.index-1,false,1)}
function showDetail(id){const n=nodes[id];state.selected=id;$('detail').hidden=false;$('detailTitle').textContent=n.name;const links=edges.filter(e=>e[1]===id||e[2]===id).map(e=>e[0]+' / '+e[3]+' m').join('；');$('detailText').textContent=n.device+'。相连连接段：'+links+'。';}
scenes.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.innerHTML='<span>'+String(i+1).padStart(2,'0')+'</span><span>'+s.name+'</span>';b.addEventListener('click',()=>choose(i));$('tabs').append(b)});
$('play').addEventListener('click',play);$('next').addEventListener('click',next);$('prev').addEventListener('click',prev);$('restart').addEventListener('click',()=>{state.chain=true;load(0,true)});$('speed').addEventListener('change',e=>state.speed=Number(e.target.value));$('seek').addEventListener('input',e=>{const f=Number(e.target.value)/1000*scenes[state.scene].steps.length;state.chain=false;load(Math.min(Math.floor(f),scenes[state.scene].steps.length-1),false,f>=scenes[state.scene].steps.length?1:f%1)});$('zoom').addEventListener('click',()=>{state.zoom=true;draw(state.q)});$('resetview').addEventListener('click',()=>{state.zoom=false;draw(state.q)});$('closeDetail').addEventListener('click',()=>{$('detail').hidden=true;state.selected=null});$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('announcement').textContent='当前环境不支持全屏，可使用浏览器全屏。'}});document.addEventListener('fullscreenchange',()=>{$('fullscreen').firstElementChild.textContent=document.fullscreenElement?'退出全屏':'全屏'});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA','BUTTON'].includes(document.activeElement?.tagName))return;if(e.code==='Space'){e.preventDefault();play()}else if(e.key==='ArrowRight'){e.preventDefault();next()}else if(e.key==='ArrowLeft'){e.preventDefault();prev()}else if(/^[1-5]$/.test(e.key))choose(Number(e.key)-1)});
function exportSVG(){const clone=svg.cloneNode(true);clone.setAttribute('xmlns',NS);clone.setAttribute('width','1920');clone.setAttribute('height','1135');return new XMLSerializer().serializeToString(clone)}
$('export').addEventListener('click',()=>{const blob=new Blob([exportSVG()],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),im=new Image();im.onload=()=>{const canvas=document.createElement('canvas');canvas.width=1920;canvas.height=1135;canvas.getContext('2d').drawImage(im,0,0,1920,1135);canvas.toBlob(b=>{if(b){const a=document.createElement('a');a.download='挂索机器人-'+scenes[state.scene].name+'.png';a.href=URL.createObjectURL(b);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}URL.revokeObjectURL(url)},'image/png')};im.onerror=()=>{URL.revokeObjectURL(url);$('announcement').textContent='导出未成功，请使用浏览器截图。'};im.src=url});
function frame(t){if(state.playing){if(!state.last)state.last=t;const dt=Math.min((t-state.last)/1000,.12);state.last=t;state.q=Math.min(1,state.q+dt*state.speed/current().duration);draw(state.q);if(state.q>=1){if(state.chain&&state.index<scenes[state.scene].steps.length-1){load(state.index+1,true)}else{state.playing=false;renderPanel();draw(1)}}}else state.last=0;requestAnimationFrame(frame)}
window.reviewDemo={scenes:scenes.map(s=>({name:s.name,steps:s.steps.map(t=>t.title)})),selectScene:choose,setStep:(i,q=1)=>load(i,false,q),getState:()=>({scene:state.scene,index:state.index,q:state.q,playing:state.playing,title:current().title,task:current().state,metric:$('metric').textContent}),exportSVG};choose(0);requestAnimationFrame(frame);
})();
}
try{const saved=JSON.parse(sessionStorage.getItem('robot-demo-'+version));if(saved){window.reviewDemo.selectScene(saved.scene);window.reviewDemo.setStep(saved.index,saved.q)}}catch{}</script></body></html>
